<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 627px; background: #1c1c1c; overflow: hidden; }
  body { font-family: "Fira Code", monospace; position: relative; }
  .logo { position: absolute; left: 80px; top: 72px; display: flex; align-items: center; }
  .logo .name { background: #ffffff; color: #1c1c1c; font-weight: 700; font-size: 26px; padding: 12px 14px; line-height: 28px; }
  .logo .bars { margin-left: 14px; height: 44px; width: 718px;
    background: repeating-linear-gradient(90deg, #ffffff 0 3px, transparent 3px 14px); }
  .title { position: absolute; left: 80px; right: 80px; top: 190px; bottom: 140px;
    display: flex; align-items: center; color: #ffffff; font-size: 54px; font-weight: 600; line-height: 1.25; }
  .nowrap { white-space: nowrap; }
  .domain { position: absolute; left: 80px; bottom: 76px; color: #8f8f8f; font-size: 24px; }
</style>
</head>
<body>
  <div class="logo"><span class="name">Under the Model</span><span class="bars"></span></div>
  <div class="title"><div>{{TITLE}}</div></div>
  <div class="domain">oguzpastirmaci.com</div>
</body>
</html>
