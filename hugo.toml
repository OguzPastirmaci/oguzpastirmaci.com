baseURL = "https://oguzpastirmaci.com/"
locale = "en-US"
title = "Under the Model"
theme = "terminal"
pagination.pagerSize = 5
enableRobotsTXT = true

# The theme's syntax highlighting needs CSS classes.
[markup.highlight]
  noClasses = false

[params]
  contentTypeName = "posts"
  showMenuItems = 4
  fullWidthTheme = false
  centerTheme = true
  subtitle = "Notes on GPUs, RDMA and Kubernetes."
  # The theme has no default text for these labels.
  readMore = "Read more"
  readOtherPosts = "Read other posts"
  menuMore = "Show more"

  [params.logo]
    logoText = "Under the Model"

# From Hugo's GitHub Pages guide.
[caches.images]
  dir = ":cacheDir/images"

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 1

[[menu.main]]
  identifier = "how-dranet-works"
  name = "How dranet works"
  url = "/how-dranet-works/"
  weight = 2

# Header links, opened in a new tab.
[[menu.main]]
  identifier = "linkedin"
  name = "LinkedIn"
  url = "https://www.linkedin.com/in/oguzpastirmaci/"
  weight = 3
  [menu.main.params]
    newTab = true

[[menu.main]]
  identifier = "github"
  name = "GitHub"
  url = "https://github.com/OguzPastirmaci"
  weight = 4
  [menu.main.params]
    newTab = true
